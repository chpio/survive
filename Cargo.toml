[package]
name = "survival"
version = "0.0.0"
edition = "2024"

[dependencies]
anyrender_vello = "0.15"
avian2d = "0.8"
blitz-dom = "=0.3.0-beta.4"
blitz-paint = "=0.3.0-beta.4"
blitz-traits = "=0.3.0-beta.4"
dioxus = { version = "=0.8.0-alpha.3", default-features = false, features = ["macro", "html", "signals", "hooks"] }
dioxus-native-dom = "=0.8.0-alpha.3"
vello = { version = "0.11", default-features = false, features = ["wgpu"] }

[dependencies.bevy]
version = "0.20"
default-features = false
features = [
    "dynamic_linking",
    "file_watcher",
    "bevy_dev_tools",
    "render_dev_tools",

    # default features https://docs.rs/bevy/0.20.0/bevy/index.html#default-features
    "std",
    "async_executor",
    # "android-game-activity",
    # "android_shared_stdcxx",
    # "animation",
    "bevy_asset",
    # "bevy_audio",
    # "bevy_color",
    "bevy_core_pipeline",
    # "bevy_post_process",
    # "bevy_anti_alias",
    # "bevy_gilrs",
    # "bevy_gizmos",
    # "bevy_gltf",
    # "bevy_input_focus",
    "bevy_log",
    # "bevy_mesh_picking_backend",
    # "bevy_pbr",
    # "bevy_picking",
    "bevy_render",
    # "bevy_scene",
    "bevy_image",
    # "bevy_mesh",
    "bevy_camera",
    # "bevy_light",
    # "bevy_shader",
    "bevy_sprite",
    "sprite_picking",
    "bevy_sprite_render",
    "bevy_state",
    # "bevy_text",
    "bevy_ui",
    "ui_picking",
    "bevy_ui_render",
    "bevy_window",
    "bevy_winit",
    # "custom_cursor",
    "default_font",
    # "hdr",
    # "ktx2",
    "multi_threaded",
    "png",
    # "reflect_auto_register",
    # "smaa_luts",
    "sysinfo_plugin",
    # "tonemapping_luts",
    # "vorbis",
    # "webgl2",
    "x11",
    "wayland",
    "debug",
    # "zstd_rust",
]

[dependencies.bevy_ecs_tiled]
version = "0.14"
features = ["avian"]

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

[profile.release]
codegen-units = 1
lto = "thin"
