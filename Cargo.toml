[package]
name = "survival"
version = "0.0.0"
edition = "2024"
publish = false
# the files in tests/ are modules of the single test binary below, not test binaries of their own
autotests = false

# all tests live in tests/, in one binary, so the game and its dependencies are linked only once
[[test]]
name = "it"
path = "tests/main.rs"

# Criterion benchmarks, run with `cargo bench`; see docs/architecture/benchmarks.md
[[bench]]
name = "flowfield"
harness = false

# without tests or benchmarks of their own, they would only link empty binaries, and libtest
# would reject Criterion's arguments to `cargo bench`
[lib]
test = false
bench = false
doctest = false

[[bin]]
name = "survival"
test = false
bench = false

[lints.clippy]
# Bevy system params (queries with filters) are complex types by nature
type_complexity = "allow"
# Bevy systems take everything they access as parameters
too_many_arguments = "allow"

[features]
default = ["dev"]
# faster rebuilds and hot-reloaded assets; a shipped build turns it off with --no-default-features,
# a dynamically linked executable can't be shipped
dev = ["bevy/dynamic_linking", "bevy/file_watcher"]

[dependencies]
anyrender_vello = "0.15"
avian2d = "0.8"
blitz-dom = "=0.3.0-beta.4"
blitz-paint = "=0.3.0-beta.4"
blitz-traits = "=0.3.0-beta.4"
dioxus = { version = "=0.8.0-alpha.3", default-features = false, features = ["macro", "html", "signals", "hooks"] }
dioxus-native-dom = "=0.8.0-alpha.3"
fastrand = "2"
# reads the figures' .glb files; Bevy's own glTF loader would pull in its 3D renderer
gltf = { version = "1.4.1", default-features = false, features = ["names", "utils"] }
ron = "0.12"
serde = { version = "1", features = ["derive"] }
# Blitz's style engine, the same version and features, to mark nodes for recomputation (ui::resize)
style = { package = "stylo", version = "0.22" }
vello = { version = "0.11", default-features = false, features = ["wgpu"] }

[dev-dependencies]
criterion = { version = "0.8.2", default-features = false, features = ["cargo_bench_support"] }

[dependencies.bevy]
version = "0.20"
default-features = false
features = [
    # default features https://docs.rs/bevy/0.20.0/bevy/index.html#default-features
    "std",
    "async_executor",
    # "android-game-activity",
    # "android_shared_stdcxx",
    # skeletal animation of the figures (src/figure.rs)
    "bevy_animation",
    "bevy_curve",
    "bevy_asset",
    # "bevy_audio",
    # "bevy_color",
    "bevy_core_pipeline",
    # "bevy_post_process",
    # "bevy_anti_alias",
    # "bevy_gilrs",
    "bevy_gizmos",
    "bevy_gizmos_render",
    # "bevy_gltf",
    # "bevy_input_focus",
    "bevy_log",
    # items on the ground are meshes, picked by `items::render::Plugin`
    "mesh_picking",
    # "bevy_pbr",
    # "bevy_picking",
    "bevy_render",
    # "bevy_scene",
    "bevy_image",
    # "bevy_mesh",
    "bevy_camera",
    # "bevy_light",
    # "bevy_shader",
    "bevy_sprite",
    # "sprite_picking",
    "bevy_sprite_render",
    "bevy_state",
    # "bevy_text",
    "bevy_ui",
    # the HUD picks itself (ui::pick_hud), Bevy's UI picking would hit its fullscreen image everywhere
    # "ui_picking",
    "bevy_ui_render",
    "bevy_window",
    "bevy_winit",
    # "custom_cursor",
    "default_font",
    # "hdr",
    # "ktx2",
    "multi_threaded",
    "png",
    # "reflect_auto_register",
    # "smaa_luts",
    "sysinfo_plugin",
    # "tonemapping_luts",
    # "vorbis",
    # "webgl2",
    "x11",
    "wayland",
    "debug",
    # "zstd_rust",
]

[dependencies.bevy_ecs_tiled]
version = "0.15"
features = ["avian"]

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

[profile.release]
codegen-units = 1
lto = "thin"

# release build for x86-64-v3 CPUs (AVX2, FMA) in its own target/release-v3/; a profile can't set
# the target CPU, so RUSTFLAGS adds it, see CLAUDE.md
[profile.release-v3]
inherits = "release"
