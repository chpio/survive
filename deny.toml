# cargo-deny config (https://embarkstudios.github.io/cargo-deny/), run in CI by `cargo deny check`

[advisories]
# the defaults: vulnerabilities, unmaintained and unsound crates fail, yanked crates warn
ignore = [
    # quick-xml before 0.41 can be made to run in quadratic time or allocate without bound by a
    # crafted XML file. It comes in through tiled (0.16, the latest, needs quick-xml 0.31) and only
    # parses the map files of the game's own assets.
    "RUSTSEC-2026-0194",
    "RUSTSEC-2026-0195",
    # ttf-parser is unmaintained (no known vulnerability), it comes in through the window
    # decorations of winit on Wayland (sctk-adwaita) that Bevy brings along
    "RUSTSEC-2026-0192",
]

[licenses]
# MPL-2.0 comes in through stylo and the other servo crates of Blitz, Unicode-3.0 through the icu
# crates, BSD-3-Clause through tiny-skia, ISC through libloading, MIT-0 through encase, BSD-2-Clause
# through arrayref, CC0-1.0 through notify, BSL-1.0 through xxhash-rust, Zlib through foldhash;
# every other license in the tree is only an alternative to one of these
allow = [
    "MIT",
    "Apache-2.0",
    "MPL-2.0",
    "Unicode-3.0",
    "Zlib",
    "BSD-3-Clause",
    "BSD-2-Clause",
    "ISC",
    "MIT-0",
    "CC0-1.0",
    "BSL-1.0",
]

[licenses.private]
# the game itself has no license, it isn't published (`publish = false`)
ignore = true

[bans]
# several versions of one crate are often unavoidable (Bevy and Blitz bring a lot), so they only
# warn
multiple-versions = "warn"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
